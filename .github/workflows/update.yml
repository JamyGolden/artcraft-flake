# Update the the app binaries if a later binary exist and bump the flake inputs
name: update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update flake inputs
        run: nix flake update

      - name: Update releases
        run: bash ./scripts/update.sh | tee "$RUNNER_TEMP/releases.txt"

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- flake.lock releases.json; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
            git diff --stat -- flake.lock releases.json
          fi

      - name: Check
        if: steps.diff.outputs.changed == 'true'
        run: nix flake check -L

      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock releases.json
          {
            echo "Update releases and flake inputs"
            echo
            grep -- ' -> ' "$RUNNER_TEMP/releases.txt" || true
          } | git commit -F -
          git push
